name: Test thread resolution
on:
  pull_request:
permissions: {}
jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          gh api graphql -f id="$THREAD" -f query='mutation($id: ID!) { resolveReviewThread(input: { threadId: $id }) { thread { id isResolved } } }'
        env:
          THREAD: PRRT_kwDOVkrKrc60dTB5
