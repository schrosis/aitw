version: v0.1
start: fetch
steps:
  fetch:
    type: script
    run: echo "hello"
    outputs:
      title: ${{ result.stdout }}
    next: report
  report:
    type: script
    run: test "${{ inputs.title }}" = hello && echo "title=${{ inputs.title }}"
    inputs:
      title: ${{ steps.fetch.outputs.title }}
    next: end
