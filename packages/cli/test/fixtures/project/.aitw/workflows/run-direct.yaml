version: v0.1
inputs:
  name:
    type: string
    required: true
  prefix:
    type: string
    default: report
start: greet
steps:
  greet:
    type: script
    run: echo 'Hello ${{ workflow.inputs.name }}!!'
    outputs:
      file: ${{ workflow.inputs.prefix }}-${{ result.stdout }}
    next: report
  report:
    type: script
    run: echo '${{ steps.greet.outputs.file }}'
    next: end
