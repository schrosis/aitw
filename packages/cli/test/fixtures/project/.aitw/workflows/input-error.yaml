version: v0.1
inputs:
  threshold:
    type: number
    default: 1.5
  level:
    type: choice
    options: [low, low]
    required: true
    default: mid
start: report
steps:
  report:
    type: script
    inputs:
      missing: ${{ workflow.inputs.missing }}
      nested: ${{ workflow.inputs.threshold.value }}
    run: "true"
    next: end
