$schema: ../schemas/workflow.schema.json

version: v0.1

inputs:
  name:
    type: string
    required: true
    description: plan で作った作業の名前。docs/work/<name>/tasks.md の、まだ終わっていない最初の PR を実装する
  reviewer:
    type: string
    default: schrosis
    description: PR のレビューを待つ人の GitHub のログイン名。Claude Review（github-actions[bot]）のレビューも待つ

env:
  WORK_NAME: ${{ workflow.inputs.name }}

start: pick

steps:
  # 1. PR を拾う
  # tasks.md の形は .claude/skills/sdd-tasks/rules/tasks.md の「形の決まり」にある。大タスク 1 つが PR 1 つになる。
  # 先頭の未完了の大タスクの行から、次の大タスクの行か見出しの前までを 1 つの PR として出す。
  # Wave は上から順に並ぶため、今は先頭の未完了の PR を 1 つずつ実装する。
  pick:
    type: script
    run: |
      case "$WORK_NAME" in
        '' | -* | *[!a-z0-9-]*)
          echo "The name must contain only lowercase letters, digits, or -, and not start with -: $WORK_NAME" >&2
          exit 1
          ;;
      esac

      dir="docs/work/$WORK_NAME"
      for file in requirements.md design.md tasks.md; do
        if [ ! -f "$dir/$file" ]; then
          echo "$dir/$file does not exist. Run the plan workflow first" >&2
          exit 1
        fi
      done

      pr=$(awk '
        /^- \[[ x]\] [0-9]+\. / { if (found) exit }
        /^- \[ \] [0-9]+\. / { found = 1; print; next }
        found && /^#/ { exit }
        found && /^[^ \t-]/ { exit }
        found { print }
      ' "$dir/tasks.md")
      if [ -z "$pr" ]; then
        echo "Every pull request in $dir/tasks.md is done" >&2
        exit 1
      fi

      # 依存する PR（大タスク）がすべて終わっていることを確かめる。注釈は大タスクの行の直後にある。
      dependencies=$(printf '%s\n' "$pr" | sed -n 's/^  - _Depends: \(.*\)_[[:space:]]*$/\1/p' | head -n 1)
      for dependency in $(printf '%s\n' "$dependencies" | tr ',' ' '); do
        case "$dependency" in
          '' | *[!0-9]*)
            echo "The dependency must be the number of a major task, such as 1: $dependency" >&2
            exit 1
            ;;
        esac
        if ! grep -Eq "^- \[x\] $dependency\. " "$dir/tasks.md"; then
          echo "Task $dependency is not done. Finish it before this pull request" >&2
          exit 1
        fi
      done
      printf '%s\n' "$pr"
    outputs:
      pr: ${{ trim(result.stdout) }}
    next: branch

  # 2. main を最新にして、PR のブランチを切る
  # 今すでに PR のブランチにいるなら、前の develop が途中で止めた続きなので、そのまま使う。
  branch:
    type: script
    env:
      PR: ${{ steps.pick.outputs.pr }}
    run: |
      branch=$(printf '%s\n' "$PR" | sed -n 's/^  - _Branch: `\{0,1\}\([^`_]*\)`\{0,1\}_[[:space:]]*$/\1/p' | head -n 1)
      case "$branch" in
        '' | /* | */ | *//* | *[!a-z0-9/-]*)
          echo "The pull request needs a line such as \"  - _Branch: feat/short-name_\": $branch" >&2
          exit 1
          ;;
      esac

      if [ "$(git branch --show-current)" != "$branch" ]; then
        git fetch origin main
        git switch main
        git merge --ff-only origin/main
        if git show-ref --verify --quiet "refs/heads/$branch"; then
          git switch "$branch"
        else
          git switch -c "$branch"
        fi
      fi
      printf '%s\n' "$branch"
    outputs:
      name: ${{ trim(result.stdout) }}
    next: implement

  # 3. 実装
  implement:
    type: ai
    provider: claude-code
    model: claude-opus-5-5
    timeout: 60m
    prompt: |
      ugoke リポジトリで、次の PR を実装してください。PR は tasks.md の大タスクです。中のサブタスクを、
      上から順にすべて実装してください。
      コミット、push、ブランチの作成はしないでください。
      docs/work/${{ workflow.inputs.name }}/ の文書は変更しないでください。変更が要るときは、下の
      `人間の判断を仰ぐとき` に従ってください。

      ## PR
      ${{ steps.pick.outputs.pr }}

      ## 要件、設計、タスクの一覧
      docs/work/${{ workflow.inputs.name }}/ の requirements.md、design.md、tasks.md を読んで、
      それに沿って実装してください。サブタスクの `_Requirements:_` にある番号の受け入れ基準を満たしてください。
      tasks.md に「実装メモ」の節があれば、前の PR で得た知見なので、それも踏まえてください。

      変えるのは、PR の `_Boundary:_` にある部品のファイルです。部品とファイルの対応は、design.md の
      「ファイルの構成」にあります。同じ Wave のほかの PR と変えるファイルが重ならないように決めた境界です。
      境界の外のファイルを変えるのは、テストの補助や公開する名前の追加など、小さく、ほかの PR と
      ぶつからないものだけにしてください。それ以外は、人間の判断を仰いでください。

      ## 確かめ方
      pnpm check は、あなたが作業を終えた後にワークフローが実行し、失敗したら結果を渡して戻します。
      あなたは pnpm check を実行せず、変更に関係するものだけを実行してください。
      たとえば pnpm --filter <パッケージ> test、pnpm typecheck、pnpm lint です。
      ugoke パッケージのテストにはビルドの結果が要るため、その場合は先に pnpm build を実行してください。

      ## これまでのまとめ（前回あなたが書いたもの。空なら初回）
      ${{ steps.implement.outputs.summary }}

      ## 前回の pnpm check の結果（空なら未実行）
      ${{ steps.check.outputs.log }}

      ## 最後に受けたローカルのレビューの指摘（空ならなし）
      ${{ steps.review.outputs.findings }}

      ## 最後に受けた判断の回答（空ならなし）
      ${{ steps.decide.outputs.answer }}

      ## 最後に受けた PR のレビュー（空ならなし）
      レビューした人: ${{ steps.wait_review.outputs.author }}
      状態: ${{ steps.wait_review.outputs.state }}

      ${{ steps.wait_review.outputs.body }}

      ## PR のレビューへの対応
      まず `gh pr view ${{ steps.branch.outputs.name }} --json url,state,reviews` で、このブランチの
      PR を確かめてください。前の develop が途中で止まった続きのときは、PR がすでにあることがあります。
      開いている PR があれば、次のものをすべて読んで、指摘に対応してください。
      - 最後に push した後に出されたレビューの本文。上の「最後に受けた PR のレビュー」は、その中の
        1 件だけのことがある
      - 未解決のレビューのスレッド
      スレッドへの返信と push は、あとのステップが行います。

      上の指摘や回答のうち、まだ対応していないものに対応してください。
      これまでのまとめで対応済みのものに、もう一度対応する必要はありません。

      ## 人間の判断を仰ぐとき
      次のような、あなたが決めるべきでないことにぶつかったら、作業を途中で止めて status を
      needs_decision にし、question に判断してほしいことを書いてください。
      - 要件、設計、タスクの一覧から外れる必要がある。またはそれらが間違っている、足りない
      - PR の境界の外のファイルを、上に書いた小さな変更を超えて変える必要がある
      - 仕様が曖昧で、妥当な解釈が複数あり、どれを選ぶかで結果が変わる
      - 公開 API、設定、データの形式など、後から変えにくいものを決める必要がある
      - 依存の追加、ファイルの削除など、設計にない大きな変更が要る
      question には、背景、選択肢、あなたのおすすめとその理由を書いてください。
      要件、設計、タスクの一覧を直すべきなら、そのこともおすすめに書いてください。
      既存のコード、要件と設計から判断できることは、聞かずに進めてください。

      作業を終えたら status を done にし、question は空にしてください。

      ## 要件、設計、タスクの一覧への反映
      PR がマージされると、ワークフローが tasks.md のこの PR に完了の印を付けます。
      次のどれかに当たるときだけ、reflect を true にしてください。別のステップが文書を直します。
      - 実装が要件や設計から外れた。または、実装の中で要件や設計にないことを決めた
      - 後の PR の内容を直す必要がある気づきがある
      - 後の PR の実装に役立つ知見がある。たとえば、使える既存の部品、守るべき約束事、はまりやすい
        ところ。この PR だけに関わることは含めない
      どれにも当たらなければ false にしてください。

      ## まとめの書き方
      summary には、今回の分だけでなく、これまでのまとめを引き継いで、この PR 全体を通して
      何をしたかを、サブタスクごとに書いてください。受けた指摘や判断と、それにどう対応したかも
      含めてください。要件や設計から外れたこと、後の PR に関わる気づきや知見があれば、それも
      書いてください。
    schema:
      type: object
      properties:
        status:
          enum: [done, needs_decision]
          description: 作業を終えたなら done、人間の判断を待つなら needs_decision
        question:
          type: string
          description: 判断してほしいこと。背景、選択肢、おすすめと理由を Markdown で書く。done なら空
        summary:
          type: string
          description: PR 全体を通して、したことと、わかったこと。Markdown で簡潔に書く
        reflect:
          type: boolean
          description: 要件、設計、後の PR に反映すべきこと、後の PR に役立つ知見があれば true
      required: [status, question, summary, reflect]
    with:
      allowedTools: [Read, Edit, Write, Grep, Glob, Bash]
    outputs:
      status: ${{ result.data.status }}
      question: ${{ result.data.question }}
      summary: ${{ result.data.summary }}
      reflect: ${{ result.data.reflect }}
    next:
      - if: ${{ result.data.status == 'needs_decision' }}
        to: decide
      - to: check

  # 4. 実装中に人間の判断を仰ぐ
  decide:
    type: wait
    method: terminal
    with:
      message: |
        ## PR
        ${{ steps.pick.outputs.pr }}

        ## ここまでのまとめ
        ${{ steps.implement.outputs.summary }}

        ## 判断してほしいこと
        ${{ steps.implement.outputs.question }}

        要件、設計、タスクを直すなら `反映して終える` を選んでください。
        直す場合は、この PR は終えずに止まりますので、develop をもう一度回してください。
      schema:
        action:
          type: choice
          options: [続ける, 反映して終える]
          required: true
        answer:
          type: string
          multiline: true
          required: true
          description: 判断の内容。反映して終えるなら、要件、設計、タスクをどう直すか
    outputs:
      action: ${{ result.action }}
      answer: ${{ result.answer }}
    next:
      - if: ${{ result.action == '反映して終える' }}
        to: reflect
      - to: implement

  # 5. リンター、フォーマット、テストなどのチェック
  check:
    type: script
    continueOnError: true
    timeout: 30m
    # mise の temporal のシムは、テストが起動する常駐プロセスの中では使えないため、実体を先に置く。
    # 失敗したときだけ、outputs の上限を超えないよう最後の 200 行を出す。
    run: |
      temporal=$(mise which temporal)
      PATH="$(dirname "$temporal"):$PATH"
      code=0
      out=$(pnpm check 2>&1) || code=$?
      if [ "$code" -ne 0 ]; then
        printf '%s\n' "$out" | tail -n 200
      else
        echo "pnpm check passed"
      fi
      exit "$code"
    outputs:
      log: ${{ result.stdout }}
    next:
      - if: ${{ !result.ok }}
        to: implement
      - to: review

  # 6. ローカルのレビュー
  # PR の中のタスクをまとめて、1 回のレビューで見る。
  review:
    type: ai
    provider: claude-code
    model: claude-opus-5-5
    prompt: |
      ugoke リポジトリの、まだコミットしていない変更をレビューしてください。コードは変更しないでください。
      git diff と git status で変更を確かめ、.claude/review.md の観点に従ってください。
      この PR のブランチ（${{ steps.branch.outputs.name }}）で、main からの変更を見てください。
      PR のレビューに対応した後なら、コミット済みの変更（git diff main...HEAD）も合わせて見てください。

      ## PR
      ${{ steps.pick.outputs.pr }}

      ## 要件、設計、タスクの一覧
      docs/work/${{ workflow.inputs.name }}/ の requirements.md、design.md、tasks.md

      ## 実装した人のまとめ
      ${{ steps.implement.outputs.summary }}

      ## これまでのレビューのまとめ（前回あなたが書いたもの。空なら初回）
      ${{ steps.review.outputs.summary }}

      次のことも確かめてください。
      - PR の中のサブタスクがすべて実装され、それぞれの終わったときに確かめられることを満たしているか
      - サブタスクの `_Requirements:_` にある番号の受け入れ基準を満たし、要件と設計に沿っているか
      - PR の `_Boundary:_` の外のファイルを、ほかの PR とぶつかる形で変えていないか

      直すべき問題があれば verdict を changes にし、findings に今回の指摘を書いてください。
      なければ approve にし、findings は空にしてください。

      summary には、今回の分だけでなく、これまでのレビューのまとめを引き継いで、レビュー全体を
      通して確かめたこと、出した指摘、それぞれが対応済みかどうかを書いてください。
    schema:
      type: object
      properties:
        verdict:
          enum: [approve, changes]
        findings:
          type: string
          description: 今回の指摘。Markdown で書く。approve なら空
        summary:
          type: string
          description: レビュー全体を通して、確かめたこと、指摘と対応の状況。Markdown で書く
      required: [verdict, findings, summary]
    with:
      allowedTools: [Read, Grep, Glob, "Bash(git diff:*)", "Bash(git status:*)", "Bash(git log:*)"]
    outputs:
      verdict: ${{ result.data.verdict }}
      findings: ${{ result.data.findings }}
      summary: ${{ result.data.summary }}
    next:
      - if: ${{ result.data.verdict == 'changes' }}
        to: implement
      - to: publish

  # 7. コミット、push し、PR を作るか、PR のレビューに返信する
  publish:
    type: ai
    provider: claude-code
    model: claude-opus-5-5
    prompt: |
      ugoke リポジトリで、この PR の変更をコミットして push し、PR を作ってください。
      PR がすでにあるときは、PR のレビューへの返信もしてください。
      コードとファイルは変更しないでください。

      ## PR
      ${{ steps.pick.outputs.pr }}

      ## ブランチ
      ${{ steps.branch.outputs.name }}

      ## 実装のまとめ
      ${{ steps.implement.outputs.summary }}

      ## 最後に受けた PR のレビュー（空ならなし）
      レビューした人: ${{ steps.wait_review.outputs.author }}
      状態: ${{ steps.wait_review.outputs.state }}

      ${{ steps.wait_review.outputs.body }}

      ## PR があるかを確かめる
      まず `gh pr view ${{ steps.branch.outputs.name }} --json url,state` で、このブランチの PR を確かめて
      ください。前の develop が途中で止まった続きのときは、この実行より前に作った PR があることがあります。
      開いている PR があれば「PR がすでにあるとき」、なければ「PR がまだないとき」に従ってください。

      ## コミットと push
      - この PR のために変えたファイルだけを、名前を指定して git add してください。
        git add -A や git add . は使わないでください。README.md など、この PR と関係のない変更は
        含めないでください
      - コミットのメッセージは、英語で Conventional Commits に従って書いてください。本文には、
        何をなぜ変えたかを書いてください。PR の中のサブタスクが独立していて、分けたほうがレビュー
        しやすいときは、サブタスクごとにコミットを分けてもかまいません
      - 変更がなければ、コミットしないでください
      - ブランチを origin に push してください。force push はしないでください

      ## PR がまだないとき
      - gh pr create --base main で作ってください。タイトルはコミットの要約と同じ形にしてください
      - 本文は、.github/pull_request_template.md に沿って日本語で書いてください
      - docs/work/ はリポジトリに入っていないため、本文で参照しないでください。レビューに要る背景は、
        本文に直接書いてください
      - 確認した内容には、実際に確かめたことだけを書いてください

      ## PR がすでにあるとき
      - 前に push した後に出されたレビューの本文も、`gh pr view --json reviews` で読んで、返信に
        含めてください
      - push した後、未解決のレビューのスレッドすべてに、対応したコミットと内容を返信してください。
        対応しない指摘には、その理由を返信してください。スレッドは解決しないでください
      - コードを変えずに返信だけした場合は、PR に `@claude` とコメントして、再レビューを頼んで
        ください。push した場合は、再レビューが自動で始まります
    schema:
      type: object
      properties:
        url:
          type: string
          description: PR の URL（https://github.com/<owner>/<repo>/pull/<number>）
        summary:
          type: string
          description: コミット、push、PR の作成、返信のうち、したこと。Markdown で簡潔に書く
      required: [url, summary]
    with:
      allowedTools: [Read, Grep, Glob, "Bash(git:*)", "Bash(gh:*)"]
    outputs:
      url: ${{ result.data.url }}
      summary: ${{ result.data.summary }}
    next: wait_review

  # 8. PR のレビューかマージを待つ
  # Approve されたら、マージを待ち続ける。claude[bot] のインラインのコメントのレビューは数えない。
  # github_pr は、待ち始めた後に出された最も早いレビューの 1 件だけを答える。ほかのレビューの本文は、
  # implement と publish が gh で読む。同じ間に Claude Review の Approve と reviewer の Request changes
  # が出て、Approve のほうが早いと、マージを待ち続けてしまう。そのときは、reviewer がもう一度レビュー
  # を出すと進む。
  wait_review:
    type: wait
    method: github_pr
    with:
      message: PR のレビューかマージを待っています
      pr: ${{ steps.publish.outputs.url }}
      events: [review, merged, closed]
      review:
        authors:
          - github-actions[bot]
          - ${{ workflow.inputs.reviewer }}
    outputs:
      event: ${{ result.event }}
      author: ${{ result.reviewAuthor }}
      state: ${{ result.reviewState }}
      body: ${{ result.reviewBody }}
    next:
      - if: ${{ result.event == 'merged' }}
        to: mark_done
      - if: ${{ result.event == 'closed' }}
        to: closed
      - if: ${{ result.reviewState == 'APPROVED' }}
        to: wait_review
      - to: implement

  # マージされずに閉じられたら、失敗にする
  closed:
    type: script
    env:
      URL: ${{ steps.publish.outputs.url }}
    run: |
      echo "The pull request was closed without merging: $URL" >&2
      exit 1
    next: end

  # 9. PR に完了の印を付ける
  # 拾った PR が今も先頭の未完了の大タスクであることを確かめてから、大タスクとそのサブタスクに付ける。
  mark_done:
    type: script
    env:
      PR: ${{ steps.pick.outputs.pr }}
    run: |
      file="docs/work/$WORK_NAME/tasks.md"
      line=$(printf '%s\n' "$PR" | head -n 1)
      first=$(grep -E -m 1 '^- \[ \] [0-9]+\. ' "$file" || true)
      if [ "$first" != "$line" ]; then
        echo "The first unfinished pull request in $file is not the one that ran: $first" >&2
        exit 1
      fi
      number=$(printf '%s\n' "$line" | sed 's/^- \[ \] \([0-9]*\)\. .*$/\1/')
      tmp="$file.tmp.$$"
      awk -v number="$number" '
        $0 ~ "^- \\[ \\] " number "\\. " || $0 ~ "^- \\[ \\]\\*? " number "\\.[0-9]+ " {
          sub(/^- \[ \]/, "- [x]")
        }
        { print }
      ' "$file" > "$tmp"
      mv "$tmp" "$file"
      printf '%s\n' "$line" | sed 's/^- \[ \] /- [x] /'
    outputs:
      line: ${{ trim(result.stdout) }}
    next:
      - if: ${{ steps.implement.outputs.reflect }}
        to: reflect
      - to: finish

  # 10. 要件、設計、タスクに反映する
  # 実装が要件や設計から外れたとき、後の PR に役立つ知見があるとき、実装の途中で止めたときだけ動く。
  # 直すところだけを Edit で直す。
  reflect:
    type: ai
    provider: claude-code
    model: claude-opus-5-5
    prompt: |
      ugoke リポジトリの docs/work/${{ workflow.inputs.name }}/ にある requirements.md、design.md、
      tasks.md に、次の結果を反映してください。
      直すところだけを Edit で直してください。直さない文書は、書き直さないでください。
      ほかのファイルは変更しないでください。

      ## PR
      ${{ steps.pick.outputs.pr }}

      ## 完了の印（空なら、PR は完了していません）
      ${{ steps.mark_done.outputs.line }}

      ## 実装のまとめ
      ${{ steps.implement.outputs.summary }}

      ## 実装中の判断
      ### 質問
      ${{ steps.implement.outputs.question }}

      ### 回答
      ${{ steps.decide.outputs.answer }}

      ## 反映のしかた
      完了の印があれば、PR は完了しています。tasks.md の印は、ワークフローが付けました。
      - 実装で要件や設計から外れたこと、決まったことがあれば、requirements.md と design.md に反映する
      - 後の PR に影響する気づきがあれば、その PR の内容を直す
      - 後の PR の実装に役立つ知見があれば、tasks.md の「## 実装メモ」の節に、`- ` で始まる行で
        書き足す。どの PR で得た知見かを、行の先頭に `1: ` のように大タスクの番号で書く。節がなければ、
        「## 人間が行う作業」の前に作る。その節もなければ、文書の最後に作る

      完了の印が空なら、実装の途中で判断を受けて止めています。PR は完了していません。
      - 回答に沿って、requirements.md、design.md、tasks.md を直す
      - この PR の大タスクは `- [ ] ` のままにする。内容を直す、分ける、前に新しい大タスクを足すのはよい
      - 作業ツリーに残った途中の変更は、次の develop が同じブランチで引き継ぐ。そのことを踏まえて
        PR を書く。この PR の `_Branch:_` は変えない

      tasks.md を直すときは、.claude/skills/sdd-tasks/rules/tasks.md の決まり、特に「Wave」と
      「形の決まり」を守ってください。develop は、その形をスクリプトで読みます。
      今ある大タスクの番号は振り直さないでください。新しい大タスクには、今ある最大の番号の次を振ってください。
    schema:
      type: object
      properties:
        changes:
          type: string
          description: 何をどう直したか。直すことがなかったなら、その理由。Markdown で書く
      required: [changes]
    with:
      allowedTools:
        - Read
        - Grep
        - Glob
        - Edit(docs/work/${{ workflow.inputs.name }}/**)
        - Bash(git diff:*)
        - Bash(git status:*)
    outputs:
      changes: ${{ result.data.changes }}
    next:
      # 途中で止めたときは、次の develop が続きをやれるよう、PR のブランチに残る。
      - if: ${{ steps.mark_done.outputs.line == null }}
        to: end
      - to: finish

  # 11. main を最新にして終える
  finish:
    type: script
    run: |
      git switch main
      git pull --ff-only
    next: end
