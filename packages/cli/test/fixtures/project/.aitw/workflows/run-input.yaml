version: v0.1
inputs:
  threshold:
    type: number
    description: Minimum score to report
    default: 1.5
  level:
    type: choice
    options: [low, high]
    required: true
  note:
    type: string
start: report
steps:
  report:
    type: script
    inputs:
      threshold: ${{ workflow.inputs.threshold }}
      level: ${{ workflow.inputs.level }}
      note: ${{ workflow.inputs.note }}
    run: echo "threshold=${{ inputs.threshold }} level=${{ inputs.level }} note=[${{ inputs.note }}]"
    next: end
