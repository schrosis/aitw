$schema: ../schemas/workflow.schema.json

version: v0.1

inputs:
  name:
    type: string
    required: true
    description: 作業の名前。docs/work/<name>/ に要件、設計、タスクを置く。英小文字、数字、- だけ
  request:
    type: string
    required: true
    description: 作りたいもの

env:
  WORK_NAME: ${{ workflow.inputs.name }}

start: prepare

# 段階ごとに、SDD のスキル（.claude/skills/sdd-*）で文書を書き、別のスキルで検証してから、人間の承認を待つ。
# 書き方と検証の観点はスキルにあり、ここには流れだけを書く。スキルの約束事は .claude/sdd/conventions.md にある。
# 検証の結果は承認の画面に出すだけで、文書は直さない。直すかどうかは人間が決め、直すときは差し戻しの理由に書く。
steps:
  # docs/work/ は Git で追跡していないため、上書きすると戻せない。文書がすでにあれば止める。
  prepare:
    type: script
    run: |
      case "$WORK_NAME" in
        '' | -* | *[!a-z0-9-]*)
          echo "The name must contain only lowercase letters, digits, or -, and not start with -: $WORK_NAME" >&2
          exit 1
          ;;
      esac

      dir="docs/work/$WORK_NAME"
      for file in requirements.md design.md tasks.md; do
        if [ -e "$dir/$file" ]; then
          echo "$dir/$file already exists. Use another name, or remove $dir first" >&2
          exit 1
        fi
      done

      mkdir -p "$dir"
      echo "$dir"
    outputs:
      dir: ${{ trim(result.stdout) }}
    next: requirements

  # 1. 要件
  requirements:
    type: ai
    provider: claude-code
    model: claude-opus-5-5
    prompt: |
      sdd-requirements スキルで、作業 ${{ workflow.inputs.name }} の要件を書いてください。

      ## 作りたいもの
      ${{ workflow.inputs.request }}

      ## 差し戻しの理由（空なら初回）
      ${{ steps.approve_requirements.outputs.feedback }}

      ## 前回の検証の結果（空なら未検証）
      ${{ steps.validate_requirements.outputs.findings }}
    schema:
      type: object
      properties:
        changes:
          type: string
          description: スキルの報告の「変更」。Markdown で簡潔に書く
        open_points:
          type: string
          description: スキルの報告の「未決の論点」。なければ「なし」。Markdown で簡潔に書く
      required: [changes, open_points]
    with:
      allowedTools:
        - Skill(sdd-requirements)
        - Read
        - Grep
        - Glob
        - Bash(git log:*)
        - Bash(ls:*)
        - Edit(docs/work/${{ workflow.inputs.name }}/requirements.md)
    outputs:
      changes: ${{ result.data.changes }}
      open_points: ${{ result.data.open_points }}
    next: validate_requirements

  # 結果のうちギャップは、設計のステップにも渡す。
  validate_requirements:
    type: ai
    provider: claude-code
    model: claude-opus-5-5
    session: new
    prompt: |
      sdd-validate-gap スキルで、作業 ${{ workflow.inputs.name }} の要件を検証してください。
    schema:
      type: object
      properties:
        verdict:
          enum: [ok, issues]
          description: スキルの報告の「判定」
        findings:
          type: string
          description: スキルの報告の「問題」。ok なら「なし」。Markdown で書く
        gap:
          type: string
          description: スキルの報告の「ギャップ」。Markdown で書く
      required: [verdict, findings, gap]
    with:
      allowedTools:
        - Skill(sdd-validate-gap)
        - Read
        - Grep
        - Glob
        - Bash(git log:*)
        - Bash(ls:*)
    outputs:
      verdict: ${{ result.data.verdict }}
      findings: ${{ result.data.findings }}
      gap: ${{ result.data.gap }}
    next: show_requirements

  show_requirements:
    type: script
    run: |
      file="docs/work/$WORK_NAME/requirements.md"
      if [ ! -s "$file" ]; then
        echo "$file was not written" >&2
        exit 1
      fi
      cat "$file"
    outputs:
      document: ${{ result.stdout }}
    next: approve_requirements

  approve_requirements:
    type: wait
    method: terminal
    with:
      message: |
        ## 今回の変更
        ${{ steps.requirements.outputs.changes }}

        ## 未決の論点
        ${{ steps.requirements.outputs.open_points }}

        ## 検証の結果（${{ steps.validate_requirements.outputs.verdict }}）
        ${{ steps.validate_requirements.outputs.findings }}

        ---

        ${{ steps.show_requirements.outputs.document }}

        ---

        ${{ steps.prepare.outputs.dir }}/requirements.md に書きました。この内容でいいですか？
      schema:
        decision:
          type: choice
          options: [OK, 差し戻し]
          required: true
        feedback:
          type: string
          multiline: true
          description: 差し戻す理由。未決の論点に答えるときと、検証の結果に対応させるときも、差し戻してここに書く
    outputs:
      decision: ${{ result.decision }}
      feedback: ${{ result.feedback }}
    next:
      - if: ${{ result.decision == '差し戻し' }}
        to: requirements
      - to: design

  # 2. 設計
  design:
    type: ai
    provider: claude-code
    model: claude-opus-5-5
    prompt: |
      sdd-design スキルで、作業 ${{ workflow.inputs.name }} の設計を書いてください。

      ## 既存のコードとのギャップ（要件の検証の結果）
      ${{ steps.validate_requirements.outputs.gap }}

      ## 差し戻しの理由（空なら初回）
      ${{ steps.approve_design.outputs.feedback }}

      ## 前回の検証の結果（空なら未検証）
      ${{ steps.validate_design.outputs.findings }}
    schema:
      type: object
      properties:
        changes:
          type: string
          description: スキルの報告の「変更」。Markdown で簡潔に書く
        open_points:
          type: string
          description: スキルの報告の「未決の論点」。なければ「なし」。Markdown で簡潔に書く
      required: [changes, open_points]
    with:
      allowedTools:
        - Skill(sdd-design)
        - Read
        - Grep
        - Glob
        - Bash(git log:*)
        - Bash(ls:*)
        - Edit(docs/work/${{ workflow.inputs.name }}/design.md)
    outputs:
      changes: ${{ result.data.changes }}
      open_points: ${{ result.data.open_points }}
    next: validate_design

  validate_design:
    type: ai
    provider: claude-code
    model: claude-opus-5-5
    session: new
    prompt: |
      sdd-validate-design スキルで、作業 ${{ workflow.inputs.name }} の設計を検証してください。
    schema:
      type: object
      properties:
        verdict:
          enum: [ok, issues]
          description: スキルの報告の「判定」
        findings:
          type: string
          description: スキルの報告の「判定」以外のすべて。ok なら「なし」でよい。Markdown で書く
      required: [verdict, findings]
    with:
      allowedTools:
        - Skill(sdd-validate-design)
        - Read
        - Grep
        - Glob
        - Bash(git log:*)
        - Bash(ls:*)
    outputs:
      verdict: ${{ result.data.verdict }}
      findings: ${{ result.data.findings }}
    next: show_design

  show_design:
    type: script
    run: |
      file="docs/work/$WORK_NAME/design.md"
      if [ ! -s "$file" ]; then
        echo "$file was not written" >&2
        exit 1
      fi
      cat "$file"
    outputs:
      document: ${{ result.stdout }}
    next: approve_design

  approve_design:
    type: wait
    method: terminal
    with:
      message: |
        ## 今回の変更
        ${{ steps.design.outputs.changes }}

        ## 未決の論点
        ${{ steps.design.outputs.open_points }}

        ## 検証の結果（${{ steps.validate_design.outputs.verdict }}）
        ${{ steps.validate_design.outputs.findings }}

        ---

        ${{ steps.show_design.outputs.document }}

        ---

        ${{ steps.prepare.outputs.dir }}/design.md に書きました。この内容でいいですか？
      schema:
        decision:
          type: choice
          options: [OK, 差し戻し]
          required: true
        feedback:
          type: string
          multiline: true
          description: 差し戻す理由。未決の論点に答えるときと、検証の結果に対応させるときも、差し戻してここに書く
    outputs:
      decision: ${{ result.decision }}
      feedback: ${{ result.feedback }}
    next:
      - if: ${{ result.decision == '差し戻し' }}
        to: design
      - to: tasks

  # 3. タスク
  tasks:
    type: ai
    provider: claude-code
    model: claude-opus-5-5
    prompt: |
      sdd-tasks スキルで、作業 ${{ workflow.inputs.name }} のタスクを書いてください。

      ## 差し戻しの理由（空なら初回）
      ${{ steps.approve_tasks.outputs.feedback }}

      ## 前回の検証の結果（空なら未検証）
      ${{ steps.validate_tasks.outputs.findings }}
    schema:
      type: object
      properties:
        changes:
          type: string
          description: スキルの報告の「変更」。Markdown で簡潔に書く
        open_points:
          type: string
          description: スキルの報告の「未決の論点」。なければ「なし」。Markdown で簡潔に書く
      required: [changes, open_points]
    with:
      allowedTools:
        - Skill(sdd-tasks)
        - Read
        - Grep
        - Glob
        - Bash(git log:*)
        - Bash(ls:*)
        - Edit(docs/work/${{ workflow.inputs.name }}/tasks.md)
    outputs:
      changes: ${{ result.data.changes }}
      open_points: ${{ result.data.open_points }}
    next: validate_tasks

  validate_tasks:
    type: ai
    provider: claude-code
    model: claude-opus-5-5
    session: new
    prompt: |
      sdd-validate-tasks スキルで、作業 ${{ workflow.inputs.name }} のタスクを検証してください。
    schema:
      type: object
      properties:
        verdict:
          enum: [ok, issues]
          description: スキルの報告の「判定」
        findings:
          type: string
          description: スキルの報告の「判定」以外のすべて。ok なら「なし」でよい。Markdown で書く
      required: [verdict, findings]
    with:
      allowedTools:
        - Skill(sdd-validate-tasks)
        - Read
        - Grep
        - Glob
        - Bash(git log:*)
        - Bash(ls:*)
    outputs:
      verdict: ${{ result.data.verdict }}
      findings: ${{ result.data.findings }}
    next: show_tasks

  show_tasks:
    type: script
    run: |
      file="docs/work/$WORK_NAME/tasks.md"
      if [ ! -s "$file" ]; then
        echo "$file was not written" >&2
        exit 1
      fi
      cat "$file"
    outputs:
      document: ${{ result.stdout }}
    next: approve_tasks

  approve_tasks:
    type: wait
    method: terminal
    with:
      message: |
        ## 今回の変更
        ${{ steps.tasks.outputs.changes }}

        ## 未決の論点
        ${{ steps.tasks.outputs.open_points }}

        ## 検証の結果（${{ steps.validate_tasks.outputs.verdict }}）
        ${{ steps.validate_tasks.outputs.findings }}

        ---

        ${{ steps.show_tasks.outputs.document }}

        ---

        ${{ steps.prepare.outputs.dir }}/tasks.md に書きました。この内容でいいですか？
      schema:
        decision:
          type: choice
          options: [OK, 差し戻し]
          required: true
        feedback:
          type: string
          multiline: true
          description: 差し戻す理由。未決の論点に答えるときと、検証の結果に対応させるときも、差し戻してここに書く
    outputs:
      decision: ${{ result.decision }}
      feedback: ${{ result.feedback }}
    next:
      - if: ${{ result.decision == '差し戻し' }}
        to: tasks
      - to: end
